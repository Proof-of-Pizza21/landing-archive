manifestVersion: 1
id: proof-of-pizza21-landing-archive
category: Productivity
name: Landing Archive
version: "0.1.14"
tagline: Keep the history of your sites and competitors' landing pages
icon: https://raw.githubusercontent.com/Proof-of-Pizza21/umbrel-community-store/main/proof-of-pizza21-landing-archive/assets/icon.svg
description: >-
  Preview for 64-bit Intel/AMD mini PCs, intended for testing on umbrelOS
  1.7.4. This initial version does not include ARM support.


  Keep versions of the websites you follow on your Umbrel. On first launch,
  create a password to protect your archive, then add the domains or pages
  to monitor and choose how often to check them.


  Save screenshots, HTML copies and page text; browse their history and
  compare changes. Discover new pages through sitemaps and links, and keep
  previous copies when a page becomes unavailable. You can manually add
  landing pages found in ads or newsletters.


  Your data stays on your device. No cloud service is required. Pages
  protected by login, CAPTCHA or anti-bot systems may not be captured.
  Landing pages without public links must be added manually.
releaseNotes: >-
  Fixed the "Failed to fetch" message that could prevent 0.1.13 from
  opening through Umbrel's authenticated proxy.


  Requests include the proxy cookie only on the app's own origin. Access
  to Landing Archive remains protected by its separate session, and all
  security protections introduced in 0.1.13 remain active.


  Your account, sites, settings and copies are preserved. Update without
  uninstalling, reopen the app from Umbrel and sign in with your current
  credentials. Check for 0.1.14 in the sidebar and engine status. Preview
  for 64-bit Intel/AMD devices running umbrelOS 1.7.4.

developer: Proof-of-Pizza21
website: https://github.com/Proof-of-Pizza21/landing-archive
dependencies: []
repo: https://github.com/Proof-of-Pizza21/landing-archive
support: https://github.com/Proof-of-Pizza21/landing-archive/issues

# Provisional host port: verify conflicts on the target Umbrel before release.
port: 4310
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: Proof-of-Pizza21
submission: ""
