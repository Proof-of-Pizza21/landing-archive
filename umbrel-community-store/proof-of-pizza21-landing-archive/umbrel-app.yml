manifestVersion: 1
id: proof-of-pizza21-landing-archive
category: Productivity
name: Landing Archive
version: "0.1.1"
tagline: La storia dei tuoi siti e delle landing dei competitor
icon: https://raw.githubusercontent.com/Proof-of-Pizza21/umbrel-community-store/main/proof-of-pizza21-landing-archive/assets/icon.svg
description: >-
  Anteprima per mini PC Intel/AMD a 64 bit, destinata al collaudo su umbrelOS
  1.7.4. Questa prima versione non include il supporto ARM.


  Conserva sul tuo Umbrel le versioni dei siti che segui. Al primo avvio crea
  una password per proteggere il tuo archivio, poi aggiungi i domini o le pagine
  da monitorare e scegli ogni quanto controllarli.


  Salva screenshot, copie HTML e testo delle pagine; consulta lo storico e
  confronta i cambiamenti. Cerca nuove pagine tramite sitemap e collegamenti,
  e conserva le copie precedenti quando una pagina non è più raggiungibile.
  Puoi aggiungere manualmente le landing trovate in annunci o newsletter.


  I dati rimangono sul tuo dispositivo. Non è richiesto un servizio cloud.
  Le pagine protette da login, CAPTCHA o sistemi anti-bot possono non essere
  acquisibili. Le landing senza collegamenti pubblici vanno aggiunte a mano.
releaseNotes: >-
  Aggiornamento di sicurezza 0.1.1: accesso alle API protetto anche con indirizzi
  codificati, limiti per immagini e metadati, confronto visivo isolato e regole
  robots.txt elaborate con un costo limitato.


  Runtime Node aggiornato e patch Debian disponibili applicate. La procedura
  di rilascio controlla vulnerabilità e segreti nell'immagine distribuita.
  Gli archivi esistenti sono conservati, senza migrazioni del database.


  Gli screenshot delle pagine molto lunghe possono essere ritagliati con un
  avviso per contenere la memoria. Destinata a mini PC Intel/AMD a 64 bit;
  il collaudo del dispositivo umbrelOS 1.7.4 resta a cura dell'utente.

